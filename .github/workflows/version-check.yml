name: Version Check

# 定期检查依赖版本是否有新 release。不自动升级，只创建 issue 通知。
# 升级决策必须人工调研后手动执行（见 VERSION_POLICY.md）。
#
# 检查项：
#   - SagerNet/sing-box 稳定版
#   - MatsuriDayo/sing-box 1.12.x 分支最新 commit
#   - starifly/sing-box 1.12.x 分支最新 commit
#   - metacubex/utls 最新 tag
#   - NekoBoxForAndroid 上游（MatsuriDayo）最新 release

on:
  schedule:
    # 每周一北京时间 10:00 (UTC 02:00) 检查一次
    - cron: '0 2 * * 1'
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read current pinned versions
        id: current
        run: |
          # sing-box commit (starifly fork)
          SINGBOX_COMMIT=$(grep 'COMMIT_SING_BOX=' buildScript/lib/core/get_source_env.sh | cut -d'"' -f2)
          echo "singbox_commit=${SINGBOX_COMMIT}" >> $GITHUB_OUTPUT
          # utls version
          UTLS_VER=$(grep 'metacubex/utls v' libcore/go.mod | awk '{print $2}')
          echo "utls_ver=${UTLS_VER}" >> $GITHUB_OUTPUT
          # libneko commit
          LIBNEKO_COMMIT=$(grep 'COMMIT_LIBNEKO=' buildScript/lib/core/get_source_env.sh | cut -d'"' -f2)
          echo "libneko_commit=${LIBNEKO_COMMIT}" >> $GITHUB_OUTPUT

      - name: Query upstream versions via GitHub API
        id: upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          echo "=== SagerNet/sing-box latest stable ==="
          SINGBOX_STABLE=$(curl -fsSL -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/SagerNet/sing-box/releases/latest" \
            | jq -r '.tag_name')
          echo "singbox_stable=${SINGBOX_STABLE}" >> $GITHUB_OUTPUT
          echo "stable: $SINGBOX_STABLE"

          echo "=== MatsuriDayo/sing-box 1.12.x latest ==="
          MD_COMMIT=$(curl -fsSL -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/MatsuriDayo/sing-box/commits/1.12.x?per_page=1" \
            | jq -r '.[0].sha')
          echo "md_singbox_commit=${MD_COMMIT}" >> $GITHUB_OUTPUT
          echo "matsuridayo 1.12.x: $MD_COMMIT"

          echo "=== starifly/sing-box 1.12.x latest ==="
          SF_COMMIT=$(curl -fsSL -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/starifly/sing-box/commits/1.12.x?per_page=1" \
            | jq -r '.[0].sha')
          echo "sf_singbox_commit=${SF_COMMIT}" >> $GITHUB_OUTPUT
          echo "starifly 1.12.x: $SF_COMMIT"

          echo "=== metacubex/utls latest tag ==="
          UTLS_LATEST=$(curl -fsSL -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/MetaCubeX/utls/tags?per_page=1" \
            | jq -r '.[0].name')
          echo "utls_latest=${UTLS_LATEST}" >> $GITHUB_OUTPUT
          echo "utls: $UTLS_LATEST"

          echo "=== MatsuriDayo/NekoBoxForAndroid latest release ==="
          NB4A_LATEST=$(curl -fsSL -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/MatsuriDayo/NekoBoxForAndroid/releases/latest" \
            | jq -r '.tag_name')
          echo "nb4a_latest=${NB4A_LATEST}" >> $GITHUB_OUTPUT
          echo "nb4a: $NB4A_LATEST"

      - name: Compare and build report
        id: diff
        run: |
          REPORT=""
          CHANGES=0

          # sing-box (starifly fork)
          if [ "${{ steps.current.outputs.singbox_commit }}" != "${{ steps.upstream.outputs.sf_singbox_commit }}" ]; then
            REPORT="${REPORT}- ⚠️ sing-box (starifly 1.12.x): ${{ steps.current.outputs.singbox_commit }} → ${{ steps.upstream.outputs.sf_singbox_commit }}\n"
            CHANGES=$((CHANGES+1))
          fi

          # utls
          if [ "${{ steps.current.outputs.utls_ver }}" != "${{ steps.upstream.outputs.utls_latest }}" ]; then
            REPORT="${REPORT}- ⚠️ utls: ${{ steps.current.outputs.utls_ver }} → ${{ steps.upstream.outputs.utls_latest }}\n"
            CHANGES=$((CHANGES+1))
          fi

          # sing-box stable (informational)
          REPORT="${REPORT}- ℹ️ sing-box 上游稳定版: ${{ steps.upstream.outputs.singbox_stable }} (我们用 neko 1.12.x fork，不直接跟上游稳定版)\n"

          # NB4A upstream (informational)
          REPORT="${REPORT}- ℹ️ NB4A 上游最新 release: ${{ steps.upstream.outputs.nb4a_latest }}\n"

          echo "report<<EOF" >> $GITHUB_OUTPUT
          echo -e "$REPORT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "changes=$CHANGES" >> $GITHUB_OUTPUT

      - name: Create or update issue
        if: steps.diff.outputs.changes != '0'
        uses: actions/github-script@v9
        with:
          script: |
            const title = '依赖版本检查报告 (自动生成)';
            const body = `## 依赖版本检查报告

            运行时间：${new Date().toISOString()}

            ### 检测到版本差异

            ${{ steps.diff.outputs.report }}

            ### 当前固定版本

            | 组件 | 版本 |
            |------|------|
            | sing-box (starifly 1.12.x) | \`${{ steps.current.outputs.singbox_commit }}\` |
            | sing-box (MatsuriDayo 1.12.x) | \`${{ steps.upstream.outputs.md_singbox_commit }}\` |
            | utls | \`${{ steps.current.outputs.utls_ver }}\` |
            | libneko | \`${{ steps.current.outputs.libneko_commit }}\` |

            ### 升级流程

            ⚠️ **不自动升级**。任何升级必须人工调研：

            1. 阅读 \`VERSION_POLICY.md\` 了解升级策略
            2. 阅读相关 \`RESEARCH_*.md\` 调研报告模板
            3. 全方位调研：API 兼容性、breaking changes、间接依赖、生态状态
            4. 在 \`RESEARCH_*.md\` 记录调研结论
            5. 修改版本号 + CI 验证 + 真机测试
            6. 更新 \`VERSION_POLICY.md\` 决策记录

            此 issue 由 version-check workflow 自动创建/更新，可安全关闭。
            `;

            // Search for existing open issue with the title
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'version-check'
            });

            if (issues.data.length > 0) {
              // Update existing
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues.data[0].number,
                body: body
              });
            } else {
              // Create new
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['version-check', 'dependencies']
              });
            }
