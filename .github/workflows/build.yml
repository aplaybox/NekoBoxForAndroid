name: Build

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish as GitHub Release (tag from VERSION_NAME)"
        type: boolean
        default: false
      release_tag:
        description: "Release tag (override, default: v{VERSION_NAME})"
        required: false
  push:
    branches:
      - main
    paths:
      - 'nb4a.properties'
      - 'libcore/**'
      - 'app/**'
      - 'buildScript/**'
      - 'buildSrc/**'
      - '.github/workflows/build.yml'

jobs:
  libcore:
    name: Native Build (LibCore)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Golang Status
        run: find buildScript libcore/*.sh | xargs cat | sha1sum > golang_status
      - name: Libcore Status
        run: git ls-files libcore | xargs cat | sha1sum > libcore_status

      - name: LibCore Cache
        id: cache
        uses: actions/cache@v6
        with:
          path: |
            app/libs/libcore.aar
          key: ${{ hashFiles('.github/workflows/*', 'golang_status', 'libcore_status') }}

      - name: Install Golang
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Native Build
        if: steps.cache.outputs.cache-hit != 'true'
        run: ./run lib core

  build:
    name: Build APK (${{ matrix.variant.name }})
    runs-on: ubuntu-latest
    needs: libcore
    strategy:
      fail-fast: false
      matrix:
        variant:
          - name: main
            flavor: oss
            package_name: top.nb4a
            apk_suffix: ""
          - name: m3e
            flavor: oss
            package_name: top.nb4a.m3e
            apk_suffix: "-m3e"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Golang Status
        run: find buildScript libcore/*.sh | xargs cat | sha1sum > golang_status
      - name: Libcore Status
        run: git ls-files libcore | xargs cat | sha1sum > libcore_status

      - name: LibCore Cache
        uses: actions/cache@v6
        with:
          path: |
            app/libs/libcore.aar
          key: ${{ hashFiles('.github/workflows/*', 'golang_status', 'libcore_status') }}
          fail-on-cache-miss: true

      - name: Gradle cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle
            .gradle
          key: gradle-${{ matrix.variant.name }}-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/**') }}
          restore-keys: gradle-${{ matrix.variant.name }}-

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Decode signing keystore
        env:
          SIGNING_KEYSTORE: ${{ secrets.SIGNING_KEYSTORE }}
        run: |
          if [ -n "$SIGNING_KEYSTORE" ]; then
            echo "$SIGNING_KEYSTORE" | base64 -d > release.keystore
            echo "keystore decoded: $(wc -c < release.keystore) bytes"
          else
            echo "WARNING: SIGNING_KEYSTORE secret not set; build will be unsigned"
          fi

      - name: Gradle Build
        env:
          BUILD_PLUGIN: none
          PACKAGE_NAME: ${{ matrix.variant.package_name }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          ALIAS_NAME: ${{ secrets.ALIAS_NAME }}
          ALIAS_PASS: ${{ secrets.ALIAS_PASS }}
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          echo "ndk.dir=${ANDROID_HOME}/ndk/27.2.12479018" >> local.properties
          ./run init action gradle
          ./gradlew app:assemble${{ matrix.variant.flavor == 'oss' && 'Oss' || matrix.variant.flavor == 'preview' && 'Preview' || 'Oss' }}Release

      - name: Collect APKs
        run: |
          mkdir -p apks
          find app/build/outputs/apk -name '*.apk' | while read apk; do
            base=$(basename "$apk")
            # rename: NekoBox-{version}-{abi}${apk_suffix}.apk
            newname="NekoBox-$(grep VERSION_NAME nb4a.properties | cut -d= -f2)${{ matrix.variant.apk_suffix }}-${base#*-}"
            cp "$apk" "apks/$newname"
          done
          ls -la apks/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: APKs-${{ matrix.variant.name }}
          path: apks/*.apk
          retention-days: 14

  publish:
    name: Publish Release
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.publish_release == 'true'
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: APKs-*
          merge-multiple: true
          path: apks

      - name: List APKs
        run: ls -la apks/

      - name: Determine tag
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.release_tag }}" ]; then
            echo "tag=${{ github.event.inputs.release_tag }}" >> $GITHUB_OUTPUT
          else
            VER=$(grep VERSION_NAME nb4a.properties | cut -d= -f2)
            echo "tag=v$VER" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          files: apks/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
