name: Release Build

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release Tag (default: v{VERSION_NAME})"
        required: false
      publish:
        description: "Publish to GitHub Releases (y/n)"
        required: false
        default: "y"
      variants:
        description: "Variants (comma-separated: main,m3e)"
        required: false
        default: "main,m3e"
      prerelease:
        description: "Mark as prerelease (y/n)"
        required: false
        default: "n"

permissions:
  contents: write

jobs:
  libcore:
    name: Native Build (LibCore)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Golang Status
        run: find buildScript libcore/*.sh | xargs cat | sha1sum > golang_status
      - name: Libcore Status
        run: git ls-files libcore | xargs cat | sha1sum > libcore_status
      - name: LibCore Cache
        id: cache
        uses: actions/cache@v6
        with:
          path: |
            app/libs/libcore.aar
          key: ${{ hashFiles('.github/workflows/*', 'golang_status', 'libcore_status') }}
      - name: Install Golang
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Native Build
        if: steps.cache.outputs.cache-hit != 'true'
        run: ./run lib core

  build:
    name: Build ${{ matrix.variant.name }}
    runs-on: ubuntu-latest
    needs: libcore
    strategy:
      fail-fast: false
      matrix:
        variant:
          - name: main
            package_name: top.nb4a
            apk_suffix: ""
          - name: m3e
            package_name: top.nb4a.m3e
            apk_suffix: "-m3e"
    steps:
      - name: Skip if not selected
        id: skip
        run: |
          SELECTED="${{ github.event.inputs.variants }}"
          NAME="${{ matrix.variant.name }}"
          if echo "$SELECTED" | grep -q "$NAME"; then
            echo "build=true" >> $GITHUB_OUTPUT
          else
            echo "build=false" >> $GITHUB_OUTPUT
          fi

      - name: Checkout
        if: steps.skip.outputs.build == 'true'
        uses: actions/checkout@v7

      - name: Golang Status
        if: steps.skip.outputs.build == 'true'
        run: find buildScript libcore/*.sh | xargs cat | sha1sum > golang_status
      - name: Libcore Status
        if: steps.skip.outputs.build == 'true'
        run: git ls-files libcore | xargs cat | sha1sum > libcore_status

      - name: LibCore Cache
        if: steps.skip.outputs.build == 'true'
        uses: actions/cache@v6
        with:
          path: |
            app/libs/libcore.aar
          key: ${{ hashFiles('.github/workflows/*', 'golang_status', 'libcore_status') }}

      - name: Gradle cache
        if: steps.skip.outputs.build == 'true'
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle
            .gradle
          key: gradle-${{ matrix.variant.name }}-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/**') }}
          restore-keys: gradle-${{ matrix.variant.name }}-

      - name: Setup JDK
        if: steps.skip.outputs.build == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Decode signing keystore
        if: steps.skip.outputs.build == 'true'
        env:
          SIGNING_KEYSTORE: ${{ secrets.SIGNING_KEYSTORE }}
        run: |
          if [ -n "$SIGNING_KEYSTORE" ]; then
            echo "$SIGNING_KEYSTORE" | base64 -d > release.keystore
          fi

      - name: Gradle Build
        if: steps.skip.outputs.build == 'true'
        env:
          BUILD_PLUGIN: none
          PACKAGE_NAME: ${{ matrix.variant.package_name }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          ALIAS_NAME: ${{ secrets.ALIAS_NAME }}
          ALIAS_PASS: ${{ secrets.ALIAS_PASS }}
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          echo "ndk.dir=${ANDROID_HOME}/ndk/27.2.12479018" >> local.properties
          ./run init action gradle
          ./gradlew app:assembleOssRelease

      - name: Collect APKs
        if: steps.skip.outputs.build == 'true'
        run: |
          mkdir -p apks
          find app/build/outputs/apk -name '*.apk' | while read apk; do
            base=$(basename "$apk")
            newname="NekoBox-${{ github.event.inputs.tag || 'release' }}${{ matrix.variant.apk_suffix }}-${base#*-}"
            cp "$apk" "apks/$newname"
          done
          ls -la apks/

      - name: Upload Artifacts
        if: steps.skip.outputs.build == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: APKs-${{ matrix.variant.name }}
          path: apks/*.apk
          retention-days: 30

  publish:
    name: Publish Release
    if: github.event.inputs.publish != 'n'
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: APKs-*
          merge-multiple: true
          path: apks

      - name: List APKs
        run: ls -la apks/

      - name: Determine tag
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            VER=$(grep VERSION_NAME nb4a.properties | cut -d= -f2)
            echo "tag=v$VER" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          prerelease: ${{ github.event.inputs.prerelease == 'y' }}
          files: apks/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
